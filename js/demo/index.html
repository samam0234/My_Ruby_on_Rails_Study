<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rails Study · JavaScript</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <section class="card">
        <p class="eyebrow">js/demo · study1</p>
        <h1 id="title">불러오는 중</h1>
        <p>이 폴더는 Rails 앱과 따로 둡니다. 같은 환영 문구를 JavaScript로 만들고, Rails 상태 주소만 가리킵니다.</p>
        <p>상태 확인: <a id="health" href="http://127.0.0.1:3000/up">http://127.0.0.1:3000/up</a></p>
      </section>
    </main>
    <script type="module">
      import { healthUrl, welcomeMessage } from "./src/greeting.js";
      document.querySelector("#title").textContent = welcomeMessage();
      const link = document.querySelector("#health");
      link.href = healthUrl();
      link.textContent = healthUrl();
    </script>
  </body>
</html>
